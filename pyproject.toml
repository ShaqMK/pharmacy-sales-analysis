[project]
name = "class-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShaqMK", email = "mburu.trades@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
class-project = "class_project:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
